<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Cash Boost">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E6FF"/><stop offset="1" stop-color="#1E6BFF"/></linearGradient>
    <linearGradient id="dollar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FF1FF"/><stop offset="0.5" stop-color="#2AA8FF"/><stop offset="1" stop-color="#1450E6"/></linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1E6BFF"/><stop offset="1" stop-color="#5CF2FF"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .halo{animation:halo 3.2s ease-in-out infinite;transform-origin:200px 200px}
    .spin{animation:spin 5s linear infinite;transform-origin:200px 200px}
    .spin2{animation:spin 9s linear infinite reverse;transform-origin:200px 200px}
    .coin{animation:pulse 3.2s ease-in-out infinite;transform-origin:192px 192px}
    .swoosh{stroke-dasharray:420;animation:draw 4s ease-in-out infinite}
    .head{animation:head 4s ease-in-out infinite}
    .trail{animation:fade 4s ease-in-out infinite}
    .spark{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .s2{animation-delay:.6s}.s3{animation-delay:1.2s}.s4{animation-delay:1.8s}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes halo{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.8;transform:scale(1.08)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes draw{0%{stroke-dashoffset:420}40%,100%{stroke-dashoffset:0}}
    @keyframes head{0%,34%{opacity:0}44%,100%{opacity:1}}
    @keyframes fade{0%,86%{opacity:1}97%,100%{opacity:0}}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.swoosh{stroke-dashoffset:0}.head{opacity:1}}
  </style>
  <circle class="halo" cx="200" cy="200" r="190" fill="#1E6BFF" opacity=".35" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#ring)" stroke-width="9" filter="url(#glow)"/>
  <circle class="spin" cx="200" cy="200" r="178" fill="none" stroke="#5CF2FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 1030" opacity=".9"/>
  <circle class="spin2" cx="200" cy="200" r="145" fill="none" stroke="#2AA8FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 860" opacity=".8"/>
  <g class="coin" filter="url(#glow)">
    <text x="192" y="272" text-anchor="middle" font-family="'Arial Black','Montserrat',Arial,sans-serif" font-weight="900" font-size="230" fill="url(#dollar)" stroke="#BFF8FF" stroke-width="2">$</text>
  </g>
  <g class="trail" filter="url(#glow)">
    <path class="swoosh" d="M70 315 C 135 335, 285 295, 345 140" fill="none" stroke="url(#arrow)" stroke-width="16" stroke-linecap="round"/>
    <g class="head" transform="translate(348 130) rotate(-68.8)"><polygon points="30,0 -20,-24 -8,0 -20,24" fill="#5CF2FF"/></g>
  </g>
  <circle class="spark" cx="370" cy="80" r="5" fill="#9CF7FF"/>
  <circle class="spark s2" cx="40" cy="130" r="4" fill="#5CF2FF"/>
  <circle class="spark s3" cx="355" cy="260" r="3.5" fill="#9CF7FF"/>
  <circle class="spark s4" cx="65" cy="260" r="4" fill="#5CF2FF"/>
</svg>
