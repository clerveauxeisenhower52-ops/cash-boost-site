<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Page introuvable — Cash Boost</title>
<script>try{var t=localStorage.getItem('cashboost_theme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme='dark'}</script>
<style>
:root,[data-theme="dark"]{--bg:#07070a;--card:#13131a;--line:rgba(255,255,255,.10);--text:#f4f4f6;--muted:#a3a3b1;--gold:#fccf02;--gold-text:#f6d96a}
[data-theme="light"]{--bg:#f3f3f6;--card:#fff;--line:rgba(15,16,20,.14);--text:#0f1014;--muted:#4f4f5c;--gold:#fccf02;--gold-text:#8f6c00}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{display:grid;place-items:center;min-height:100vh;padding:24px;background:radial-gradient(800px 420px at 50% -10%,rgba(252,207,2,.10),transparent 60%),var(--bg);color:var(--text);font:16px/1.5 'Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;max-width:420px;padding:36px 28px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:28px;box-shadow:0 30px 70px -40px rgba(0,0,0,.6)}
.mark{width:44px;height:44px;margin:0 auto 22px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#ffe066,#d9a800);color:#0a090e;font:700 15px 'Space Grotesk',system-ui,sans-serif}
.big{font:700 72px/1 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.05em;color:var(--gold-text);font-variant-numeric:tabular-nums}
.state{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--gold-text)}
.state::before{content:"";width:8px;height:8px;border-radius:50%;background:#fb7185;box-shadow:0 0 0 4px rgba(251,113,133,.15)}
h1{margin:14px 0 8px;font:700 26px/1.15 'Space Grotesk',system-ui,sans-serif;letter-spacing:-.03em}
p{margin:0 0 26px;color:var(--muted)}
a.btn,button{display:flex;align-items:center;justify-content:center;width:100%;min-height:54px;border:0;border-radius:14px;background:linear-gradient(180deg,#ffdc3d,#f2bf00);color:#0a090e;font:700 16px 'Space Grotesk',system-ui,sans-serif;text-decoration:none;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px -8px rgba(252,207,2,.45)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style></head><body><main>
<div class="mark">CB</div>
<div class="big">404</div><h1>Page introuvable</h1><p>Ce lien n'existe pas ou a été déplacé.</p><a class="btn" href="/">Retour à l'accueil</a>
</main></body></html>
