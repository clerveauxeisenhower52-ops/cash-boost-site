<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 232 232" width="232" height="232">
<title>Cash Boost</title>
<defs>
<linearGradient id="gr" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="180"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<linearGradient id="gd" gradientUnits="userSpaceOnUse" x1="76" y1="44" x2="124" y2="156"><stop offset="0" stop-color="#c8f4ff"/><stop offset=".45" stop-color="#3da5ff"/><stop offset="1" stop-color="#1e55e6"/></linearGradient>
<linearGradient id="gs" gradientUnits="userSpaceOnUse" x1="40" y1="150" x2="164" y2="92"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#67e8f9"/></linearGradient>
<radialGradient id="hg" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#1f6bff" stop-opacity=".5"/><stop offset=".7" stop-color="#1f6bff" stop-opacity=".18"/><stop offset="1" stop-color="#1f6bff" stop-opacity="0"/></radialGradient>
<filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
.halo{animation:halo 2.8s ease-in-out infinite}
.ring{stroke-dasharray:100;animation:draw 1.2s .1s cubic-bezier(.35,.7,.2,1) both}
.s{stroke-dasharray:100;animation:draw .9s .6s cubic-bezier(.4,.1,.2,1) both}
.bar{stroke-dasharray:100;animation:draw .5s .9s ease-out both}
.dol{transform-box:fill-box;transform-origin:center;animation:breathe 2.8s 2.2s ease-in-out infinite}
.sw{stroke-dasharray:100;animation:draw .8s 1.5s cubic-bezier(.4,.1,.2,1) both}
.ah{transform-box:fill-box;transform-origin:center;animation:pop .4s 2.2s cubic-bezier(.3,1.6,.5,1) both}
.rip{opacity:0;transform-box:fill-box;transform-origin:center;animation:rip 2.4s 2.4s ease-out infinite}
.orb{transform-origin:100px 100px;animation:fade .4s 1.8s both,spin 3.4s linear infinite}
.sp{opacity:0;transform-box:fill-box;transform-origin:center;animation:tw 3.4s 2.4s ease-in-out infinite}
@keyframes draw{from{stroke-dashoffset:100;opacity:0}2%{opacity:1}to{stroke-dashoffset:0;opacity:1}}
@keyframes halo{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes rip{from{opacity:.6;transform:scale(1)}to{opacity:0;transform:scale(1.2)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tw{0%,55%,100%{opacity:0;transform:scale(0) rotate(0)}78%{opacity:1;transform:scale(1) rotate(45deg)}}
</style>
<circle class="halo" cx="100" cy="100" r="92" fill="url(#hg)"/>
<circle class="rip" cx="100" cy="100" r="86" fill="none" stroke="#22d3ee" stroke-width="2"/>
<g filter="url(#gl)"><circle class="ring" cx="100" cy="100" r="86" pathLength="100" fill="none" stroke="url(#gr)" stroke-width="5" stroke-linecap="round" transform="rotate(-90 100 100)"/></g>
<g class="dol" filter="url(#gl)">
<path class="s" pathLength="100" d="M126 70 C126 56 114 50 100 50 C84 50 74 60 74 73 C74 87 85 93 100 98 C116 103 127 109 127 124 C127 138 116 148 100 148 C86 148 75 142 72 128" fill="none" stroke="url(#gd)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
<line class="bar" pathLength="100" x1="100" y1="36" x2="100" y2="162" stroke="url(#gd)" stroke-width="9" stroke-linecap="round"/>
</g>
<path class="sw" pathLength="100" d="M40 140 Q98 190 160 98" fill="none" stroke="#071433" stroke-opacity=".92" stroke-width="17" stroke-linecap="round"/>
<g filter="url(#gl)"><path class="sw" pathLength="100" d="M40 140 Q98 190 160 98" fill="none" stroke="url(#gs)" stroke-width="8" stroke-linecap="round"/></g>
<g transform="translate(160 98) rotate(-56)" filter="url(#gl)"><polygon class="ah" points="17,0 -10,-13 -10,13" fill="#67e8f9"/></g>
<g class="orb"><circle cx="100" cy="14" r="4.2" fill="#fff" filter="url(#gl)"/></g>
<path class="sp" d="M150 38 l3.2 9.8 9.8 3.2 -9.8 3.2 -3.2 9.8 -3.2 -9.8 -9.8 -3.2 9.8 -3.2z" fill="#fff"/>
</svg>
