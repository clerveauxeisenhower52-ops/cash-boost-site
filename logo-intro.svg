<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700" role="img" aria-label="Cash Boost">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#0B2A6B"/><stop offset="1" stop-color="#040A1E"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22E6FF"/><stop offset="1" stop-color="#1E6BFF"/></linearGradient>
    <linearGradient id="dollar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7FF1FF"/><stop offset=".5" stop-color="#2AA8FF"/><stop offset="1" stop-color="#1450E6"/></linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1E6BFF"/><stop offset="1" stop-color="#5CF2FF"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <style>
    .halo{transform-origin:300px 270px;opacity:0;animation:haloIn 1s ease-out forwards,halo 3.2s 1s ease-in-out infinite}
    .ring{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.1s .2s cubic-bezier(.5,0,.2,1) forwards}
    .spin{transform-origin:300px 270px;opacity:0;animation:fade .4s 1.2s forwards,spin 5s 1.2s linear infinite}
    .spin2{transform-origin:300px 270px;opacity:0;animation:fade .4s 1.3s forwards,spin 9s 1.3s linear infinite reverse}
    .coin{transform-origin:292px 262px;transform:scale(0);animation:pop .7s .8s cubic-bezier(.2,1.5,.4,1) forwards,pulse 3.2s 1.6s ease-in-out infinite}
    .swoosh{stroke-dasharray:420;stroke-dashoffset:420;animation:draw .7s 1.5s ease-out forwards}
    .head{opacity:0;animation:fade .25s 2.1s forwards}
    .spark{opacity:0;transform-box:fill-box;transform-origin:center;animation:twinkle 2.4s 2.2s ease-in-out infinite}
    .s2{animation-delay:2.8s}.s3{animation-delay:3.4s}.s4{animation-delay:4s}
    .t1,.t2{opacity:0;animation:rise .8s ease-out forwards}
    .t1{animation-delay:2.2s}.t2{animation-delay:2.5s}
    @keyframes haloIn{to{opacity:.35}}
    @keyframes halo{0%,100%{opacity:.35;transform:scale(.95)}50%{opacity:.8;transform:scale(1.08)}}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes pop{to{transform:scale(1)}}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fade{to{opacity:.9}}
    @keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.ring{stroke-dashoffset:0}.halo{opacity:.35}.coin{transform:none}.swoosh{stroke-dashoffset:0}.head,.t1,.t2{opacity:1}}
  </style>
  <rect width="600" height="700" fill="url(#bg)"/>
  <circle class="halo" cx="300" cy="270" r="190" fill="#1E6BFF" filter="url(#glow)"/>
  <circle class="ring" cx="300" cy="270" r="160" pathLength="1000" fill="none" stroke="url(#ring)" stroke-width="9" transform="rotate(-90 300 270)" filter="url(#glow)"/>
  <circle class="spin" cx="300" cy="270" r="178" fill="none" stroke="#5CF2FF" stroke-width="4" stroke-linecap="round" stroke-dasharray="90 1030"/>
  <circle class="spin2" cx="300" cy="270" r="145" fill="none" stroke="#2AA8FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="50 860"/>
  <g class="coin" filter="url(#glow)">
    <text x="292" y="342" text-anchor="middle" font-family="'Arial Black',Arial,sans-serif" font-weight="900" font-size="230" fill="url(#dollar)" stroke="#BFF8FF" stroke-width="2">$</text>
  </g>
  <g filter="url(#glow)">
    <path class="swoosh" d="M170 385 C 235 405, 385 365, 445 210" fill="none" stroke="url(#arrow)" stroke-width="16" stroke-linecap="round"/>
    <g class="head" transform="translate(448 200) rotate(-68.8)"><polygon points="30,0 -20,-24 -8,0 -20,24" fill="#5CF2FF"/></g>
  </g>
  <circle class="spark" cx="470" cy="150" r="5" fill="#9CF7FF"/>
  <circle class="spark s2" cx="140" cy="200" r="4" fill="#5CF2FF"/>
  <circle class="spark s3" cx="455" cy="330" r="3.5" fill="#9CF7FF"/>
  <circle class="spark s4" cx="165" cy="330" r="4" fill="#5CF2FF"/>
  <g class="t1"><text x="300" y="560" text-anchor="middle" font-family="Montserrat,Poppins,Arial,sans-serif" font-weight="800" font-size="72"><tspan fill="#FFFFFF">Cash </tspan><tspan fill="#2AA8FF">Boost</tspan></text></g>
  <g class="t2"><text x="300" y="612" text-anchor="middle" font-family="Montserrat,Poppins,Arial,sans-serif" font-weight="600" font-size="30" fill="#5CF2FF">Recharge rapide et sécurisée</text></g>
</svg>
